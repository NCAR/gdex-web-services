on:
  pull_request:
    types:
      - closed
    branches:
      - main
    paths-ignore:
      - ".github/**"
      - ".gitignore"
      - "app-chart/**"
      - "README.md"
      - "LICENSE"
  workflow_dispatch:
    inputs:
      run_reason:
        description: 'Provide a reason or comment for this workflow'
        required: false
        type: string
        default: 'No comment provided'

jobs:
  container-rebuild:
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.RILEY_HARBOR_USERNAME }}
          password: ${{ secrets.RILEY_HARBOR_PASSWORD }}
          registry: hub.k8s.ucar.edu/riley_gdex_test
      - name: Checkout the repository
        uses: actions/checkout@v4
        with:
          ref: main
          ssh-key: ${{ secrets.ACTIONS_PUSH_KEY }}
      - name: Build new container image
        run: >
          docker build --platform linux/amd64
          -t hub.k8s.ucar.edu/riley_gdex_test/gdex-web-services:v${{ github.run_id }}
          --no-cache -f Dockerfile .
      - name: Push image to Harbor
        run: |
          docker push hub.k8s.ucar.edu/riley_gdex_test/gdex-web-services:v${{ github.run_id }}
          docker tag hub.k8s.ucar.edu/riley_gdex_test/gdex-web-services:v${{ github.run_id }} hub.k8s.ucar.edu/riley_gdex_test/gdex-web-services:latest
          docker push hub.k8s.ucar.edu/riley_gdex_test/gdex-web-services:latest
      - name: Update Helm chart image tag
        run: |
          git config user.email "${{ secrets.GIT_CONFIG_USER_EMAIL }}"
          git config user.name "${{ secrets.GIT_CONFIG_USER_NAME }}"
          sed -E "/image/s/gdex-web-services:(.){1,}/gdex-web-services:v${{ github.run_id }}/" app-chart/values.yaml > app-chart/values.yaml.new
          mv app-chart/values.yaml.new app-chart/values.yaml
          git add app-chart/values.yaml
          git commit -m "update image to v${{ github.run_id }}"
          git push
