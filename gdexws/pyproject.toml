[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "gdexws"
dynamic = ["version"]
description = "GDEX web service tools for data processing and management"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
    {name = "GDEX Team"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

dependencies = [
    "netCDF4>=1.5.0",
    "httpx>=0.24.0",
]

[project.scripts]
add-global-meta = "gdexws.tools.add_global_meta:main"
transform = "gdexws.composers.transform:main"

[project.urls]
Homepage = "https://github.com/NCAR/gdex-web-services"

[tool.setuptools]
packages = ["gdexws", "gdexws.tools", "gdexws.utils", "gdexws.composers"]
package-dir = {"gdexws" = "."}

[tool.setuptools_scm]
root = ".."
local_scheme = "no-local-version"
fallback_version = "0.1.0"

