replicaCount: 1

webapp:
  name: gdex-webservices
  group: gdex-web-services
  path: /
  tls:
    fqdn: gdex-services.k8s.ucar.edu
    secretName: incommon-cert-gdex-web-services
  container:
    image: hub.k8s.ucar.edu/riley_gdex_test/gdex-web-services:v29370999612
    port: 8080
    requests:
      memory: 1Gi
      cpu: 1
    limits:
      memory: 4Gi
      cpu: 2
    responseTimeout: 60
    maxUploadSize: 10m
  ingress:
    ingressClassName: nginx-external
  volume:
    name: campaign
    server: gladedm1.ucar.edu
    path: /glade/campaign/collections/gdex/
    mountPath: /glade/campaign/collections/gdex/
    readOnly: true
  # Name of the Kubernetes Secret (created out-of-band via kubectl, not
  # managed by this chart) holding the object store credentials. Must
  # contain the keys access_key_id and secret_key.
  objectStore:
    secretName: boreas
