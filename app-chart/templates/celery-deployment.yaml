apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery
  namespace: {{ .Release.Namespace }}
  labels:
    app: celery
    group: {{ .Values.webapp.group }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celery
  template:
    metadata:
      labels:
        app: celery
    spec:
      containers:
      - name: celery
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        command:
          - celery
          - -A
          - app.celery_app
          - worker
          - --loglevel=INFO
        resources:
          limits:
            cpu: "1"
            memory: 2Gi
          requests:
            cpu: "0.5"
            memory: 1Gi
