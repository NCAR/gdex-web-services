replicaCount: 1

webapp:
  name: gdex-webservices
  group: gdex-web-services
  path: /
  tls:
    fqdn: chiaweih.gdex-services.k8s.ucar.edu
    secretName: incommon-cert-chiaweih-gdex-web-services
  container:
    image: hub.k8s.ucar.edu/chiaweih-gdex-web-services-test/gdex-web-services:latest
    port: 8080
    requests:
      memory: 1Gi
      cpu: 1
    limits:
      memory: 4Gi
      cpu: 2
    responseTimeout: 60
    maxUploadSize: 10m
  ingress:
    ingressClassName: nginx-internal
  volume:
    name: campaign
    server: gladedm1.ucar.edu
    path: /glade/campaign/
    mountPath: /glade/campaign/
    readOnly: true
  # Name of the Kubernetes Secret (created out-of-band via kubectl, not
  # managed by this chart) holding the object store credentials. Must
  # contain the keys access_key_id and secret_key.
  objectStore:
    secretName: boreas
  pgdb01Secret:
    existingSecret: 
      name : pgdb01-superuser  # reference existing secret named PGDB01
      key : password      # the key inside that secret
  baoToken:
    existingSecret: 
      name : baotoken  # reference existing secret named BAOTOKEN
      key : token      # the key inside that secret

