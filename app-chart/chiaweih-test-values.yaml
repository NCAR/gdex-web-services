replicaCount: 1

webapp:
  name: gdex-webservices
  group: gdex-web-services
  path: /
  tls:
    fqdn: chiaweih.gdex-services.k8s.ucar.edu
    secretName: incommon-cert-chiaweih-gdex-web-services
  container:
    image: hub.k8s.ucar.edu/chiaweih-gdex-web-services-test/gdex-web-services:latest
    port: 8080
    requests:
      memory: 1Gi
      cpu: 1
    limits:
      memory: 4Gi
      cpu: 2
    responseTimeout: 60
    maxUploadSize: 10m
  ingress:
    ingressClassName: nginx-internal
  volume:
    name: campaign
    server: gladedm1.ucar.edu
    path: /glade/campaign/
    mountPath: /glade/campaign/
    readOnly: true
  # Name of the Kubernetes Secret (created out-of-band via kubectl, not
  # managed by this chart) holding the object store credentials. Must
  # contain the keys access_key_id and secret_key.
  objectStore:
    secretName: boreas
  pgdb01Secret:
    existingSecret:
      name: pgdb0102-superuser  # reference existing secret named PGDB01
  externalSecret:
    baoPath: kv/gdex/pgdb01

# Redis: Celery broker + result backend, on separate logical DBs.
redis:
  # true  = deploy a Redis Deployment/Service/PVC from this chart (own test instance)
  # false = use an existing external Redis at `host` (e.g. one managed by its own Helm release)
  deploy: true
  name: gdex-redis        # used when deploy: true (Service name, prefixed with testName if set)
  host: redis             # used when deploy: false — Service DNS name of the external Redis
  port: 6379
  brokerDb: 0
  resultDb: 1
  # Optional password auth for an external Redis: existing Secret + key holding the password.
  auth:
    existingSecret: ""
    passwordKey: redis-password
  # The settings below only apply when deploy: true
  image:
    repository: redis      # official image from Docker Hub (docker.io/library/redis)
    tag: "8.10.2-trixie"
    pullPolicy: IfNotPresent
  persistence:
    enabled: true         # appendonly yes + PVC, so scheduled retries survive a restart
    size: 2Gi
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m

# Celery worker: runs app/tasks/transform_tasks.py. Scales independently of replicaCount.
celeryWorker:
  name: gdex-webservices-celery
  replicaCount: 2
  concurrency: 4
  # image: defaults to webapp.container.image when unset
  resources:
    requests:
      memory: 512Mi
      cpu: 500m
    limits:
      memory: 2Gi
      cpu: 1
